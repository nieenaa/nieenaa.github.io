<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - JTMK Mobile Site</title>
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f4f4f4;
    }

    .header {
      color: #2d8be6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: white;
      padding: 20px 0px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .header .logo {
      display: flex;
      align-items: center;
    }

    .header .logo img {
      height: 65px;
      margin-right: 10px;
    }

    .header .nav a {
      margin-left: 30px;
      padding: 0 10px;
      text-decoration: none;
      color: black;
      font-weight: 600;
      font-size: 16px;
    }

    .header .nav a:hover {
      color: #2d8be6;
    }

    /* Social Sidebar */
    .social-sidebar {
      position: fixed;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      z-index: 999;
    }

    .social-sidebar a {
      display: block;
      padding: 10px;
      background: #fff;
      border: 1px solid #ccc;
      text-align: center;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        padding: 15px;
      }

      .header .nav {
        margin-top: 10px;
      }

      .header .nav a {
        margin-left: 0;
        margin-right: 15px;
      }

      .main-content h1 {
        font-size: 28px;
      }

      .main-content {
        padding: 160px 20px 80px;
      }
    }
  </style>
  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>

<body>

  <!-- Social Sidebar -->
  <div class="social-sidebar">
    <a href="#"><i class="fab fa-linkedin"></i></a>
    <a href="#"><i class="fab fa-github"></i></a>
    <a href="#"><i class="fab fa-twitter"></i></a>
    <a href="#"><i class="fab fa-youtube"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROyv4Nw0BIjqcgF-J1VsyBbg3NfMots20uQQ&s"
        alt="Logo" />
      <h1 style="font-size:16px;margin:0;">JABATAN TEKNOLOGI MAKLUMAT & KOMUNIKASI</h1>
    </div>
    <div class="nav">
      <a href="home.html" data-ajax="false">HOME</a>
      <a href="about.html" data-ajax="false">ABOUT</a>
      <a href="project.html" data-ajax="false">PROJECTS</a>
      <a href="contact.html" data-ajax="false">CONTACT</a>
    </div>
  </div>

  <!-- Content Section -->
  <div data-role="content" class="content-center" style="padding-top: 120px;">
    <a href="tel:+60123456789" class="ui-btn ui-icon-phone ui-btn-icon-left">Call Us</a>
    <a href="mailto:info@jtmk.edu.my" class="ui-btn ui-icon-mail ui-btn-icon-left">Email Us</a>
    <a href="https://wa.me/60123456789" class="ui-btn ui-icon-comment ui-btn-icon-left">WhatsApp</a>
  </div>

  <!-- Footer -->
  <div data-role="footer" data-position="fixed">
    <h4>Copyright © DDT4x S2 2024/2025. All rights reserved.</h4>
  </div>

</body>

</html>
